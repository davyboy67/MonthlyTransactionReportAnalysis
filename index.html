    <!--
      Resolves the theme before first paint. Must stay inline and non-module:
      a type="module" script is deferred and would run after the first paint,
      producing a flash of the wrong theme on reload.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme-preference') || 'light';
          var t =
            p === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : p;
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          if (t === 'dark') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#121211');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
